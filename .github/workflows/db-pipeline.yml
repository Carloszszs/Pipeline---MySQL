name: Validar Migraciones MySQL

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-database:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Probar migraciones (instalacion, upgrade, idempotencia)
        run: python scripts/restore_test.py

      - name: Verificar backup (dump, restauracion y comparacion)
        run: python scripts/backup_verify.py